<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14100c"><link rel="icon" href="assets/favicon.png"><title>Update Plot Status · Terralyt</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js"></script><script src="assets/bg.js"></script><script src="assets/iso.js"></script></head><body data-role="head">
<div class="pg"><h1>Update plot status</h1><div class="card" style="max-width:520px"><label>Plot</label><select id="p"></select><label>New status</label><select id="n"><option>Available</option><option>Reserved</option><option>Sold</option></select><button class="btn" onclick="sv()">Save status</button><p id="m"></p><div class="note">Each change is saved with date, time and your name as the source.</div></div></div><script>p.innerHTML=PLOTS.map(x=>`<option value="${x.id}">${x.no} (${x.st})</option>`).join("");function sv(){const x=PLOTS[p.value-1];if(x.st=="Sold"&&n.value=="Available"){m.innerHTML="<span class=\"b Sold\">Rejected</span> A sold plot cannot be marked Available without approval.";return}x.st=n.value;m.innerHTML=`<span class="b Available">Saved</span> ${x.no} is now ${x.st}, logged ${new Date().toLocaleString()}.`}</script>
</body></html>
