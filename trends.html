<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14100c"><link rel="icon" href="assets/favicon.png"><title>Trends & Forecast · Terralyt</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js"></script><script src="assets/bg.js"></script><script src="assets/iso.js"></script></head><body data-role="user">
<div class="pg"><h1>Historical trends & 5-year forecast</h1><div class="card"><div class="grid g4"><div><label>Indicator</label><select id="ind" onchange="draw()"><option value="0">Built-up %</option><option value="1">NDVI (vegetation)</option><option value="2">NDBI (built-up index)</option></select></div></div><svg id="s" viewBox="0 0 700 300" style="width:100%"></svg><span class="b High">Observed 2019–2025</span> <span class="b Medium">Forecast 2026–2030 (model estimate)</span></div><div class="note"><b>Model estimate, not a guarantee.</b> The shaded band shows the uncertainty range and widens further into the future.</div></div><script>const D=[[18,24,31,38,44,51,57],[.52,.47,.41,.36,.31,.28,.25],[.05,.1,.16,.2,.26,.3,.33]];
function draw(){const k=+ind.value,h=D[k],sl=(h[6]-h[0])/6,f=[1,2,3,4,5].map(i=>h[6]+sl*i*.8),mn=Math.min(...h,...f)*.8,mx=Math.max(...h,...f)*1.15,X=i=>50+i*(620/11),Y=v=>260-(v-mn)/(mx-mn)*230;
const all=[...h,...f],sp=Math.abs(mx-mn)*.03;let up="",lo="";f.forEach((v,i)=>{up+=`${X(7+i)},${Y(v+sp*(i+1))} `;lo=`${X(7+i)},${Y(v-sp*(i+1))} `+lo});
s.innerHTML=`<polygon points="${up}${lo}" fill="#e0a93a" opacity=".25"/><polyline fill="none" stroke="#7bd08b" stroke-width="3" points="${h.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/><polyline fill="none" stroke="#e0a93a" stroke-width="3" stroke-dasharray="6" points="${X(6)},${Y(h[6])} ${f.map((v,i)=>X(7+i)+","+Y(v)).join(" ")}"/>`+all.map((v,i)=>`<text x="${X(i)}" y="285" font-size="11" text-anchor="middle" fill="#b3a283">${2019+i}</text>`).join("")}draw()</script>
</body></html>
