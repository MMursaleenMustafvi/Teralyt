<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14100c"><link rel="icon" href="assets/favicon.png"><title>Search · Terralyt</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js"></script><script src="assets/bg.js"></script><script src="assets/iso.js"></script></head><body data-role="user">
<div class="pg"><h1>Search society or plot</h1><div class="card"><input id="q" placeholder="Society name, plot number (P-012) or coordinates (31.4120, 73.0900)" oninput="go()"><p id="m" class="mut"></p><table id="t"></table></div></div><script>function go(){const q=document.getElementById("q").value.trim().toLowerCase(),m=document.getElementById("m"),t=document.getElementById("t");if(!q){t.innerHTML="";m.textContent="Type a name, plot number or coordinates to start.";return}
let r;if(/^-?\d+\.\d+\s*,\s*-?\d+\.\d+$/.test(q)){const[a,b]=q.split(",").map(Number);r=PLOTS.filter(p=>Math.abs(p.lat-a)<.002&&Math.abs(p.lng-b)<.002)}else if(/^\d/.test(q)&&q.includes(",")){m.textContent="Invalid coordinates. Use latitude, longitude.";t.innerHTML="";return}else r=PLOTS.filter(p=>p.no.toLowerCase().includes(q)||p.blk.toLowerCase().includes(q)||"fda society".includes(q));
m.textContent=r.length?r.length+" result(s)":"No result found. Check the spelling or try a nearby plot number.";t.innerHTML=r.length?"<tr><th>Plot<th>Block<th>Area<th>Status<th>Rating<th></tr>"+r.slice(0,15).map(p=>`<tr><td>${p.no}<td>${p.blk}<td>${p.area}<td>${badge(p.st)}<td>${badge(p.cls)}<td><a href="plot.html?id=${p.id}">Details</a> · <a href="map.html?id=${p.id}">3D map</a></tr>`).join(""):""}if(qs('q'))document.getElementById('q').value=qs('q');go();Suggest(document.getElementById('q'),()=>{})</script>
</body></html>
