<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14100c"><link rel="icon" href="assets/favicon.png"><title>Society Head · Terralyt</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js"></script><script src="assets/bg.js"></script><script src="assets/iso.js"></script></head><body data-role="head">
