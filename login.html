<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14100c"><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js"></script><script src="assets/bg.js"></script><script src="assets/iso.js"></script><title>Log in · Terralyt</title></head><body><div class="auth2"><div class="aimg"><a class="brand" href="index.html" style="padding:0"><script>document.write(LOGO)</script>Terralyt</a><div><h2>Satellite evidence, not guesswork.</h2><p style="color:#cdbd9f">Evaluate FDA Society from anywhere.</p></div></div>
<div class="af"><div><img class="full" src="assets/logo-full.png" alt="Terralyt"><div id="inb" class="note" style="display:none"></div><h1 style="text-align:center">Welcome back</h1><p class="mut" style="text-align:center">Log in to your account.</p><label>Email</label><input id="em" type="email" placeholder="you@example.com"><label>Password</label><input type="password" placeholder="••••••••"><label>Role</label><select id="r"><option value="user">End User</option><option value="head">Society Head</option><option value="admin">System Administrator</option></select><button class="btn" style="width:100%" onclick="go()">Log in</button><p class="mut" style="text-align:center"><a href="#">Forgot password?</a> · <a href="signup.html">Create account</a></p><div class="note">Administrators can only log in. Accounts lock after repeated failed attempts.</div></div></div></div>
<script>function go(){const e=em.value.trim(),n=e?e.split('@')[0].replace(/^./,c=>c.toUpperCase()):NAMES[r.value];SES.set({role:r.value,name:n,email:e});location=HOME[r.value]}
const u=SES.get();if(u){inb.style.display='block';inb.innerHTML='You are logged in as <b>'+u.name+'</b>. <a href="'+HOME[u.role]+'">Continue</a> · <a href="#" onclick="logout();return false">Log out</a>'}</script></body></html>
