<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14100c"><link rel="icon" href="assets/favicon.png"><title>Society & Plot Records · Terralyt</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js"></script><script src="assets/bg.js"></script><script src="assets/iso.js"></script></head><body data-role="head">
<div class="pg"><h1>Society & plot records</h1><div class="grid g2" style="grid-template-columns:2fr 1fr"><div class="card"><table id="t"></table></div><div class="card"><h3>Add / edit plot</h3><label>Plot number</label><input id="no" placeholder="P-061"><label>Block</label><input placeholder="Block F"><label>Area</label><input placeholder="10 Marla"><label>Boundary (GeoJSON)</label><textarea rows="3"></textarea><button class="btn" onclick="add()">Save record</button><p id="m"></p></div></div></div><script>function R(){t.innerHTML="<tr><th>Plot<th>Block<th>Area<th></tr>"+PLOTS.slice(0,12).map(p=>`<tr><td>${p.no}<td>${p.blk}<td>${p.area}<td><a href="#" onclick="return del(${p.id})">Remove</a></tr>`).join("")}function add(){if(!no.value){m.textContent="Enter a plot number.";return}if(PLOTS.some(p=>p.no==no.value)){m.textContent="Rejected: plot number or boundary already exists.";return}m.textContent="Record saved and logged."}function del(i){PLOTS[i-1].area="Removed";m.textContent="Record removed and logged.";return false}R()</script>
</body></html>
